<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dialogue UI Concept</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(18, 24, 42, 0.92);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #87e6ff;
      --accent-dim: rgba(135, 230, 255, 0.18);
      --text: #eef4ff;
      --muted: #9fb0d0;
      --choice-hover: rgba(255, 255, 255, 0.06);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(80, 120, 255, 0.18), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(0, 220, 180, 0.12), transparent 24%),
        linear-gradient(180deg, #10182f 0%, #0a0d18 100%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 24px;
    }

    .world-hint {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .controls {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 10px;
      z-index: 4;
    }

    button {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(17, 22, 38, 0.88);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.18);
      background: rgba(28, 35, 58, 0.96);
    }

    .dialogue-anchor {
      position: absolute;
      left: 36px;
      bottom: 30px;
      width: min(820px, calc(100vw - 72px));
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }

    .portrait {
      width: 116px;
      height: 116px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
        linear-gradient(135deg, #3f5d86, #1a2436);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .portrait::before {
      content: "";
      position: absolute;
      inset: auto 16px 12px 16px;
      height: 38px;
      border-radius: 999px 999px 0 0;
      background: rgba(255,255,255,0.08);
    }

    .portrait::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 24px;
      width: 48px;
      height: 48px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      box-shadow: 0 0 0 10px rgba(255,255,255,0.03);
    }

    .panel {
      flex: 1 1 auto;
      min-height: 154px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      padding: 14px 16px 14px 16px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 36%);
      pointer-events: none;
    }

    .nameplate {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-dim);
      border: 1px solid rgba(135, 230, 255, 0.22);
      font-size: 13px;
      color: #dff9ff;
      letter-spacing: 0.02em;
    }

    .nameplate .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(135, 230, 255, 0.7);
    }

    .text-box {
      min-height: 62px;
      padding: 6px 2px 10px;
      font-size: 22px;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .cursor {
      display: inline-block;
      width: 10px;
      color: var(--accent);
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .choices {
      display: none;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
      gap: 8px;
      flex-direction: column;
    }

    .choice {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 16px;
    }

    .choice:hover,
    .choice.active {
      background: var(--choice-hover);
      border-color: rgba(135, 230, 255, 0.32);
      box-shadow: inset 0 0 0 1px rgba(135, 230, 255, 0.08);
    }

    .choice .index {
      display: inline-block;
      min-width: 24px;
      color: var(--accent);
      font-weight: 700;
    }

    .hint-row {
      position: absolute;
      right: 16px;
      bottom: 12px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 12px;
    }

    .panel.mode-choices .choices {
      display: flex;
    }

    .panel.mode-choices .hint-advance {
      display: none;
    }

    @media (max-width: 720px) {
      .dialogue-anchor {
        left: 16px;
        right: 16px;
        width: auto;
        gap: 10px;
        bottom: 16px;
      }

      .portrait {
        width: 82px;
        height: 82px;
        border-radius: 14px;
      }

      .panel {
        min-height: 168px;
        border-radius: 18px;
      }

      .text-box {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="world-hint">Концепт диалогового окна для top-down игры</div>

    <div class="controls">
      <button id="showTextBtn">Режим: текст</button>
      <button id="showChoicesBtn">Режим: выбор</button>
      <button id="replayBtn">Переиграть текст</button>
    </div>

    <div class="dialogue-anchor">
      <div class="portrait" aria-label="Portrait"></div>

      <div class="panel mode-text" id="panel">
        <div class="nameplate"><span class="dot"></span><span id="speakerName">Механик</span></div>

        <div class="text-box" id="textBox"></div>

        <div class="choices" id="choicesBox">
          <button class="choice active"><span class="index">1.</span> Что тут вообще произошло?</button>
          <button class="choice"><span class="index">2.</span> Мне нужен только ключ.</button>
          <button class="choice"><span class="index">3.</span> Позже вернусь.</button>
        </div>

        <div class="hint-row">
          <span class="hint-advance">Space / LMB — дальше</span>
          <span>↑ ↓ — выбор</span>
          <span>Enter — подтвердить</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const panel = document.getElementById('panel');
    const textBox = document.getElementById('textBox');
    const speakerName = document.getElementById('speakerName');
    const showTextBtn = document.getElementById('showTextBtn');
    const showChoicesBtn = document.getElementById('showChoicesBtn');
    const replayBtn = document.getElementById('replayBtn');

    const dialogueLine = 'Эй. Если идёшь в нижний сектор — не шуми. Там турели просыпаются раньше, чем ты успеешь пожалеть.';

    let typingTimer = null;

    function typeLine(text, speed = 20) {
      clearInterval(typingTimer);
      panel.classList.remove('mode-choices');
      panel.classList.add('mode-text');
      textBox.innerHTML = '';
      let i = 0;

      typingTimer = setInterval(() => {
        const visible = text.slice(0, i + 1);
        textBox.innerHTML = `${visible}<span class="cursor">|</span>`;
        i++;

        if (i >= text.length) {
          clearInterval(typingTimer);
          textBox.innerHTML = text;
        }
      }, speed);
    }

    function showChoices() {
      clearInterval(typingTimer);
      speakerName.textContent = 'Механик';
      textBox.textContent = 'Что отвечаем?';
      panel.classList.add('mode-choices');
    }

    showTextBtn.addEventListener('click', () => {
      speakerName.textContent = 'Механик';
      typeLine(dialogueLine, 18);
    });

    showChoicesBtn.addEventListener('click', () => {
      showChoices();
    });

    replayBtn.addEventListener('click', () => {
      typeLine(dialogueLine, 18);
    });

    const choices = Array.from(document.querySelectorAll('.choice'));
    let activeIndex = 0;

    function updateChoiceState() {
      choices.forEach((choice, index) => {
        choice.classList.toggle('active', index === activeIndex);
      });
    }

    choices.forEach((choice, index) => {
      choice.addEventListener('mouseenter', () => {
        activeIndex = index;
        updateChoiceState();
      });
    });

    window.addEventListener('keydown', (e) => {
      if (!panel.classList.contains('mode-choices')) return;

      if (e.key === 'ArrowDown') {
        activeIndex = (activeIndex + 1) % choices.length;
        updateChoiceState();
      }

      if (e.key === 'ArrowUp') {
        activeIndex = (activeIndex - 1 + choices.length) % choices.length;
        updateChoiceState();
      }
    });

    typeLine(dialogueLine, 18);
  </script>
</body>
</html>
