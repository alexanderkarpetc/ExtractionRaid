<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extraction HUD Concept</title>
  <style>
    :root {
      --bg-deep:        #0a0d18;
      --bg-mid:         #10182f;
      --panel:          rgba(18, 24, 42, 0.88);
      --panel-border:   rgba(255, 255, 255, 0.12);

      --text:           #eef4ff;
      --muted:          #9fb0d0;

      --accent:         #87e6ff;   /* in-progress (cyan) */
      --accent-glow:    rgba(135, 230, 255, 0.55);
      --warn:           #ffb648;   /* approach prompt (amber) */
      --warn-glow:      rgba(255, 182, 72, 0.55);
      --danger:         #ff5d6c;   /* interrupted (red) */
      --danger-glow:    rgba(255, 93, 108, 0.55);
      --success:        #6affc1;   /* complete (green) */
      --success-glow:   rgba(106, 255, 193, 0.55);

      --shadow:         0 18px 50px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 20%, rgba(80, 120, 255, 0.18), transparent 30%),
        radial-gradient(circle at 82% 30%, rgba(0, 220, 180, 0.12), transparent 24%),
        linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* ── Fake top-down playfield (just visual context) ── */
    .playfield {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.025) 0 1px,
          transparent 1px 56px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 0 1px,
          transparent 1px 56px
        );
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
    }

    .player-dot {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    /* ── Top-left context line ── */
    .world-hint {
      position: absolute;
      top: 22px;
      left: 24px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    /* ── State switcher (devtool, not part of the HUD) ── */
    .controls {
      position: absolute;
      top: 22px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 5;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 480px;
    }

    .ctrl-btn {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(17, 22, 38, 0.88);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.18s ease;
    }

    .ctrl-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.22);
      background: rgba(28, 35, 58, 0.96);
    }

    .ctrl-btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    /* ── Approach prompt (player not in zone yet) ── */
    .approach-prompt {
      position: absolute;
      left: 50%;
      bottom: 86px;
      transform: translateX(-50%);
      padding: 14px 22px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid rgba(255, 182, 72, 0.35);
      box-shadow: 0 0 40px rgba(255, 182, 72, 0.12), var(--shadow);
      color: var(--text);
      display: none;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(12px);
    }

    .approach-prompt.show { display: flex; }

    .approach-prompt .icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 182, 72, 0.35), rgba(255, 182, 72, 0.05));
      border: 1px solid rgba(255, 182, 72, 0.5);
      display: grid;
      place-items: center;
      font-size: 20px;
      color: var(--warn);
    }

    .approach-prompt .label {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .approach-prompt .name {
      font-size: 17px;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-top: 2px;
    }

    /* ── Main extraction widget (in-zone / interrupted / complete) ── */
    .extraction-widget {
      position: absolute;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 380px;
    }

    .extraction-widget.show { display: flex; }

    .ring-wrap {
      position: relative;
      width: 152px;
      height: 152px;
    }

    .ring-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    /* Conic-gradient progress fill — set --p (0..100) to animate. */
    .ring-fill {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: conic-gradient(
        var(--ring-color, var(--accent)) calc(var(--p, 0) * 1%),
        rgba(255, 255, 255, 0.04) 0
      );
      mask: radial-gradient(circle, transparent 56%, black 57%);
      -webkit-mask: radial-gradient(circle, transparent 56%, black 57%);
      transition: background 0.08s linear;
    }

    .ring-core {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: rgba(10, 14, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      place-items: center;
      flex-direction: column;
      box-shadow: inset 0 0 30px rgba(135, 230, 255, 0.06);
    }

    .ring-core .seconds {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .ring-core .seconds-suffix {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .widget-label {
      text-align: center;
    }

    .widget-label .state {
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ring-color, var(--accent));
      text-shadow: 0 0 18px var(--ring-glow, var(--accent-glow));
    }

    .widget-label .zone-name {
      font-size: 18px;
      letter-spacing: 0.06em;
      color: var(--text);
      margin-top: 6px;
    }

    .widget-hint {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* ── Status variants ── */
    .extraction-widget.is-progress {
      --ring-color: var(--accent);
      --ring-glow:  var(--accent-glow);
    }

    .extraction-widget.is-interrupted {
      --ring-color: var(--danger);
      --ring-glow:  var(--danger-glow);
    }

    .extraction-widget.is-interrupted .ring-core {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-4px); }
      40%      { transform: translateX(4px); }
      60%      { transform: translateX(-3px); }
      80%      { transform: translateX(2px); }
    }

    .extraction-widget.is-complete {
      --ring-color: var(--success);
      --ring-glow:  var(--success-glow);
    }

    .extraction-widget.is-complete .ring-fill {
      --p: 100;
    }

    .extraction-widget.is-complete .ring-core {
      animation: pop 0.5s ease-out;
    }

    @keyframes pop {
      0%   { transform: scale(0.85); }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1.0); }
    }

    .extraction-widget.is-complete .ring-core .seconds {
      font-size: 42px;
      color: var(--success);
    }

    /* Subtle scanline effect on the ring while progressing */
    .extraction-widget.is-progress .ring-core::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-linear-gradient(
        0deg,
        rgba(135, 230, 255, 0.04) 0 2px,
        transparent 2px 6px
      );
      pointer-events: none;
      animation: scan-shift 6s linear infinite;
    }

    @keyframes scan-shift {
      to { background-position: 0 24px; }
    }

    /* ── Footer chips: countdown, KB hint ── */
    .chip-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .chip strong {
      color: var(--text);
      font-weight: 600;
      margin-left: 6px;
    }

    /* ── Bottom-left compact mini-widget alternative ── */
    .mini-widget {
      position: absolute;
      left: 24px;
      bottom: 24px;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 14px 10px 10px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .mini-widget.show { display: flex; }

    .mini-ring {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: conic-gradient(
        var(--accent) calc(var(--p, 0) * 1%),
        rgba(255, 255, 255, 0.06) 0
      );
      mask: radial-gradient(circle, transparent 54%, black 55%);
      -webkit-mask: radial-gradient(circle, transparent 54%, black 55%);
    }

    .mini-text .label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .mini-text .name {
      font-size: 13px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="playfield"></div>
    <div class="player-dot"></div>

    <div class="world-hint">Extraction HUD concept — Escape-from-Duckov style</div>

    <div class="controls">
      <button class="ctrl-btn" data-state="idle">1. Idle (far)</button>
      <button class="ctrl-btn" data-state="approach">2. Approach</button>
      <button class="ctrl-btn active" data-state="progress">3. Extracting</button>
      <button class="ctrl-btn" data-state="interrupted">4. Interrupted</button>
      <button class="ctrl-btn" data-state="complete">5. Complete</button>
      <button class="ctrl-btn" id="playDemo">▶ Play full sequence</button>
    </div>

    <!-- State 2: approach prompt -->
    <div class="approach-prompt" id="approachPrompt">
      <div class="icon">⤴</div>
      <div>
        <div class="label">Extraction Point Nearby</div>
        <div class="name">North Pier · Stand inside the marker</div>
      </div>
    </div>

    <!-- State 3/4/5: main widget -->
    <div class="extraction-widget is-progress" id="widget">
      <div class="ring-wrap">
        <div class="ring-bg"></div>
        <div class="ring-fill" id="ringFill" style="--p: 36"></div>
        <div class="ring-core">
          <div class="seconds" id="seconds">5</div>
          <div class="seconds-suffix" id="secondsSuffix">seconds</div>
        </div>
      </div>

      <div class="widget-label">
        <div class="state" id="stateLabel">Extracting</div>
        <div class="zone-name">North Pier</div>
        <div class="widget-hint" id="hint">Hold position — leaving resets the timer.</div>
      </div>

    </div>

    <!-- Optional compact variant — uncomment to preview placement -->
    <div class="mini-widget" id="miniWidget">
      <div class="mini-ring" style="--p: 36"></div>
      <div class="mini-text">
        <div class="label">Extracting</div>
        <div class="name">North Pier · 5s</div>
      </div>
    </div>
  </div>

  <script>
    const widget = document.getElementById('widget');
    const approachPrompt = document.getElementById('approachPrompt');
    const miniWidget = document.getElementById('miniWidget');
    const ringFill = document.getElementById('ringFill');
    const seconds = document.getElementById('seconds');
    const secondsSuffix = document.getElementById('secondsSuffix');
    const stateLabel = document.getElementById('stateLabel');
    const hint = document.getElementById('hint');
    const elapsed = document.getElementById('elapsed');

    const buttons = document.querySelectorAll('.ctrl-btn[data-state]');
    const playDemoBtn = document.getElementById('playDemo');

    let demoTimer = null;

    function setState(state, opts = {}) {
      clearDemo();
      buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));

      // Reset shared UI
      widget.classList.remove('show', 'is-progress', 'is-interrupted', 'is-complete');
      approachPrompt.classList.remove('show');
      miniWidget.classList.remove('show');

      switch (state) {
        case 'idle':
          // nothing shown — player is far from any zone
          break;

        case 'approach':
          approachPrompt.classList.add('show');
          break;

        case 'progress': {
          widget.classList.add('show', 'is-progress');
          miniWidget.classList.add('show');
          const p = opts.percent ?? 36;
          const remaining = opts.remaining ?? 5;
          ringFill.style.setProperty('--p', p);
          miniWidget.querySelector('.mini-ring').style.setProperty('--p', p);
          seconds.textContent = remaining;
          secondsSuffix.textContent = 'seconds';
          stateLabel.textContent = 'Extracting';
          hint.textContent = 'Hold position — leaving resets the timer.';
          elapsed.textContent = (8 - remaining).toFixed(1) + 's';
          miniWidget.querySelector('.name').textContent = `North Pier · ${remaining}s`;
          break;
        }

        case 'interrupted':
          widget.classList.add('show', 'is-interrupted');
          ringFill.style.setProperty('--p', 0);
          seconds.textContent = '!';
          secondsSuffix.textContent = 'interrupted';
          stateLabel.textContent = 'Extraction Failed';
          hint.textContent = 'Step back inside the zone to retry.';
          elapsed.textContent = '0.0s';
          break;

        case 'complete':
          widget.classList.add('show', 'is-complete');
          ringFill.style.setProperty('--p', 100);
          seconds.textContent = '✓';
          secondsSuffix.textContent = 'extracted';
          stateLabel.textContent = 'Extraction Complete';
          hint.textContent = 'Returning to hideout…';
          elapsed.textContent = '8.0s';
          break;
      }
    }

    buttons.forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));

    // Full sequence: idle → approach → progress (animated) → complete
    function playDemo() {
      clearDemo();
      setState('idle');

      setTimeout(() => setState('approach'), 600);
      setTimeout(() => animateProgress(0, 8000), 2200);
    }

    function animateProgress(elapsedMs, totalMs) {
      const start = performance.now() - elapsedMs;
      function tick() {
        const t = performance.now() - start;
        const pct = Math.min(100, (t / totalMs) * 100);
        const remaining = Math.max(0, Math.ceil((totalMs - t) / 1000));
        setState('progress', { percent: pct, remaining });
        if (t < totalMs) {
          demoTimer = requestAnimationFrame(tick);
        } else {
          setTimeout(() => setState('complete'), 200);
        }
      }
      demoTimer = requestAnimationFrame(tick);
    }

    function clearDemo() {
      if (demoTimer != null) {
        cancelAnimationFrame(demoTimer);
        demoTimer = null;
      }
    }

    playDemoBtn.addEventListener('click', playDemo);

    // Boot: show the "extracting" still by default
    setState('progress', { percent: 36, remaining: 5 });
  </script>
</body>
</html>
