
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.scene {
  min-height: 300px;
  background: #080a10;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 60px;
  padding: 40px;
  font-family: 'Inter', sans-serif;
}

.demo-slot {
  width: 83px;
  height: 83px;
  background: #161b28;
  border: 2px solid #4a7cff;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 4px;
  position: relative;
  box-shadow: 0 0 18px rgba(74,124,255,0.18);
}
.s-icon { flex: 1; display: flex; align-items: center; justify-content: center; opacity: 0.55; }
.sh-medkit { width: 26px; height: 26px; position: relative; }
.sh-medkit::before { content:''; position:absolute; top:50%; left:0; transform:translateY(-50%); width:100%; height:8px; background:#b0b8c8; border-radius:1px; }
.sh-medkit::after { content:''; position:absolute; left:50%; top:0; transform:translateX(-50%); width:8px; height:100%; background:#b0b8c8; border-radius:1px; }
.s-name { font-size: 9px; font-weight: 500; color: #e0e4ec; text-align: center; margin-top: 4px; font-family: 'Inter', sans-serif; }
.s-dur { position:absolute; bottom:3px; left:6px; right:6px; height:3px; background:rgba(0,0,0,0.3); border-radius:2px; overflow:hidden; }
.s-dur-fill { height:100%; border-radius:2px; background:#2ecc71; width:72%; }

.arrow-hint { opacity: 0.3; }

.ctx-menu {
  width: 158px;
  background: rgba(14,18,28,0.98);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 7px;
  overflow: hidden;
  box-shadow: 0 16px 32px rgba(0,0,0,0.7);
}

.ctx-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  cursor: pointer;
  transition: background 0.08s;
}
.ctx-row:hover { background: rgba(224,80,64,0.10); }
.ctx-row:hover .ctx-label { color: #e05040; }
.ctx-row:hover .ctx-kbd { border-color: rgba(224,80,64,0.22); color: rgba(224,80,64,0.7); }

.ctx-label {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.75);
  transition: color 0.08s;
  letter-spacing: 0.1px;
  font-family: 'Inter', sans-serif;
}

.ctx-kbd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.28);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 1px 6px;
  transition: color 0.08s, border-color 0.08s;
}
</style>

<div class="scene">
  <div class="demo-slot">
    <div class="s-icon"><div class="sh-medkit"></div></div>
    <div class="s-name">Medkit</div>
    <div class="s-dur"><div class="s-dur-fill"></div></div>
  </div>

  <div class="arrow-hint">
    <svg width="22" height="14" viewBox="0 0 22 14" fill="none">
      <path d="M1 7h18M13 1l7 6-7 6" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="ctx-menu">
    <div class="ctx-row">
      <span class="ctx-label">Drop</span>
      <span class="ctx-kbd">Del</span>
    </div>
  </div>
</div>
